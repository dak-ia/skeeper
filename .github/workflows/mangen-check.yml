name: mangen-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# 生成物とCLI定義の乖離をCIで機械的に検出する。ubuntu単独でよい(生成結果はOS非依存)
jobs:
  mangen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain per rust-toolchain.toml
        run: rustup show
      - name: Regenerate manpage
        run: cargo run --quiet --package xtask -- manpage
      - name: Fail if docs/man/ differs from committed
        run: git diff --exit-code docs/man/
